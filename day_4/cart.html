<!DOCTYPE html>
<html>
<head>
    <title>Beauty Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8f7;
            color: #333;
        }

        header {
            background: #ffffff;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        header h2 {
            margin: 0;
            font-family: Georgia, serif;
            color: #8b5e58;
        }

        nav a {
            text-decoration: none;
            color: #444;
            margin-left: 28px;
            font-size: 15px;
        }

        nav a:hover {
            color: #b46f68;
        }

        .main {
            max-width: 1100px;
            margin: 60px auto;
            padding: 20px;
            display: flex;
            gap: 80px;
            align-items: center;
        }

        .product-box {
            width: 500px;
            height: 390px;
            background: #f3ded9;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .case {
            width: 260px;
            height: 170px;
            background: #6b4d49;
            border-radius: 12px;
            position: relative;
            box-shadow: 8px 8px 15px #c8aaa5;
        }

        .case-top {
            width: 230px;
            height: 120px;
            background: #f1e4df;
            position: absolute;
            top: -105px;
            left: 15px;
            border-radius: 8px;
            border: 6px solid #6b4d49;
        }

        .circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            position: absolute;
            bottom: 35px;
        }

        .one {
            left: 30px;
            background: #d8a28e;
        }

        .two {
            left: 82px;
            background: #a96f61;
        }

        .three {
            left: 134px;
            background: #e1b7a8;
        }

        .four {
            left: 186px;
            background: #8e5c54;
        }

        .info {
            max-width: 390px;
        }

        .tag {
            color: #b46f68;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .info h1 {
            font-family: Georgia, serif;
            font-size: 42px;
            margin: 12px 0;
            color: #4d3633;
        }

        .cost {
            font-size: 24px;
            font-weight: bold;
            color: #8b5e58;
        }

        .info p {
            line-height: 1.7;
            color: #777;
        }

        .buy-btn {
            margin-top: 15px;
            padding: 13px 32px;
            border: none;
            border-radius: 5px;
            background: #8b5e58;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .buy-btn:hover {
            background: #6b4d49;
        }

        footer {
            margin-top: 50px;
            padding: 22px;
            text-align: center;
            background: #4d3633;
            color: white;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .main {
                flex-direction: column;
                gap: 40px;
            }

            .product-box {
                width: 90%;
            }

            nav {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>BLUSH & GLOW</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Beauty</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="main">

        <div class="product-box">

            <div class="case">

                <div class="case-top"></div>

                <div class="circle one"></div>
                <div class="circle two"></div>
                <div class="circle three"></div>
                <div class="circle four"></div>

            </div>

        </div>

        <div class="info">

            <div class="tag">NEW ARRIVAL</div>

            <h1>Soft Glam<br>Eyeshadow Kit</h1>

            <div class="cost">$24.99</div>

            <p>
                Add a touch of elegance to your everyday look.
                This compact eyeshadow kit includes four
                beautiful shades along with a built-in mirror.
            </p>

            <button class="buy-btn">Shop Now</button>

        </div>

    </section>

    <footer>
        © 2026 Blush & Glow | Beauty Collection
    </footer>

</body>
</html>
